name: Refresh full item catalog snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-snapshot.yml'
      - 'scripts/build-catalog-snapshot.mjs'
      - 'catalog-resilience-v2120.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-snapshot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Check out catalog data branch
        uses: actions/checkout@v4
        with:
          ref: catalog-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate complete snapshot
        run: node app/scripts/build-catalog-snapshot.mjs data/items-full-snapshot.json

      - name: Publish only when catalog changed
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- items-full-snapshot.json)"
          if [ -z "$changes" ]; then
            echo 'Catalog snapshot unchanged.'
            exit 0
          fi
          echo "Catalog snapshot change detected: $changes"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add items-full-snapshot.json
          git commit -m 'Refresh validated full item catalog snapshot'
          git push origin HEAD:catalog-data
