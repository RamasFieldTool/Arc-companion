name: ARC Companion Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-integrity:
    name: Static data, cache and asset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON, assets, cache-busters, backup guards and version
        run: |
          node tests/data-integrity.mjs
          node tests/planning-core.mjs
          node tests/item-find-locations.mjs

  browser-smoke:
    name: Browser, mobile emulation and user-data safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/arc-http.log 2>&1 &
          echo $! > /tmp/arc-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/arc-http.log
          exit 1
      - name: Run browser and mobile-emulation quality gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/quality-gate.mjs
      - name: Run item find-location browser regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/item-find-locations-browser.mjs
      - name: Run logo home-button regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/logo-home.mjs
      - name: Run personal raid progress regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/free-raid-progress.mjs
      - name: Run current planning usability and completion regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/planning-usability.mjs
      - name: Run workshop material visibility and shared stock regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/workshop-materials.mjs
      - name: Run owned quantity stepper regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/summary-owned-stepper.mjs
      - name: Run English-first FR/ES language tests
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/i18n-smoke.mjs
      - name: Run Italian language regression
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/italian-language.mjs
      - name: Run community story text, navigation, radio and mobile language checks
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/raider-stories.mjs
      - name: Run Raider Radio collection, album navigation and five-language layout checks
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/raider-radio.mjs
      - name: Run backup, restore, migration and connection-loss tests
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/user-data-safety.mjs
      - name: Run responsive UI regression checks and capture screenshots
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/ui-regression.mjs
      - name: Upload UI regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ github.sha }}
          path: |
            test-artifacts/ui/
            test-artifacts/stories/
            test-artifacts/radio/
          if-no-files-found: warn
          retention-days: 14
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/arc-http.log || true
