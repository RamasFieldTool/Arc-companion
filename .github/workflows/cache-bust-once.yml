name: One-time live event cache bust

on:
  push:
    branches:
      - chore/live-event-cache-bust

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/live-event-cache-bust

      - name: Update live event cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'live-events-v1305.js?v=security-5ea86ac'
          new = 'live-events-v1305.js?v=clockfix-230926'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one cache reference, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit one-time change and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cache-bust-once.yml
          git add index.html
          git commit -m "Bust live event script cache"
          git push origin HEAD:chore/live-event-cache-bust
