name: One-time Android light lock
on:
  push:
    branches: [fix/android-auto-dark]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-auto-dark
      - name: Load Android auto-dark protection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='<link rel="stylesheet" href="style.css?v=themebw-60e064b">'
          inject=needle+'<link rel="stylesheet" href="light-lock-v2138.css?v=android-light-lock-230926">'
          assert s.count(needle)==1, s.count(needle)
          assert 'light-lock-v2138.css' not in s
          p.write_text(s.replace(needle, inject, 1))
          PY
          rm .github/workflows/android-light-lock-once.yml
      - name: Commit exact Android auto-dark fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/android-light-lock-once.yml
          git commit -m 'fix: load Android auto-dark protection'
          git push
