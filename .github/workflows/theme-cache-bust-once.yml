name: One-time theme cache bust
on:
  push:
    branches: [chore/theme-cache-bust]
permissions:
  contents: write
jobs:
  bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/theme-cache-bust
      - name: Update only theme asset cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='palette-v2139.css?v=themebw-60e064b'
          new_css='palette-v2139.css?v=theme-whitefix-230926'
          old_js='palette-v2139.js?v=themebw-60e064b'
          new_js='palette-v2139.js?v=theme-whitefix-230926'
          assert s.count(old_css)==1, s.count(old_css)
          assert s.count(old_js)==1, s.count(old_js)
          s=s.replace(old_css,new_css).replace(old_js,new_js)
          p.write_text(s)
          PY
          rm .github/workflows/theme-cache-bust-once.yml
      - name: Commit exact cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/theme-cache-bust-once.yml
          git commit -m 'chore: bust theme asset cache'
          git push
