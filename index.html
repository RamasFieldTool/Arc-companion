<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151611">
  <title>ARC Companion V2.6</title>
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">RAMA // FIELD TOOL</div>
    <h1>ARC <span>COMPANION</span></h1>
    <div class="version">SYS // V2.6</div>
  </header>

  <details class="goal-drawer panel">
    <summary>
      <span><b>AKTIVE ZIELE</b><small>Stationen & Stufen verwalten</small></span>
      <strong>ÄNDERN</strong>
    </summary>
    <div class="drawer-body">
      <p class="muted">Aktiviere alle Stationen/Stufen, auf die du gerade hinarbeitest.</p>
      <div id="goals"></div>
    </div>
  </details>

  <section class="panel supply-panel">
    <div class="section-kicker">SUPPLY // 01</div>
    <h2>Gesamtbedarf</h2>
    <div id="summary"></div>
  </section>

  <section class="search-panel">
    <div class="section-kicker">SCAN // 02</div>
    <label for="q">ITEM SUCHEN</label>
    <div class="search-shell">
      <span>&gt;</span>
      <input id="q" placeholder="Metall, Fabric, ARC..." autocomplete="off">
    </div>
    <div id="status"></div>
    <section id="out"></section>
  </section>

  <footer>
    <span>RAMA FIELD SYSTEM</span>
    <span>DATA // RaidTheory</span>
  </footer>
</main>
<script src="app.js?v=26"></script>
</body>
</html>
